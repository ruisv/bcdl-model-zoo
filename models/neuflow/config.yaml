# NeuFlow v2 optical flow, 512x384, ALL-INT16.
#
# The int16 directive is the whole point of this config and it is measured, not
# cautious: at int8 this model degrades into a flat ~1.9 px noise floor — a 2 px
# displacement and a 16 px displacement come back with the same error — while
# the compiler reports 0.9954 output cosine for it. A field whose dynamic range
# reaches 60 px absorbs 2 px of noise without moving a cosine. See README.md.
#
# Two inputs, both `featuremap` with `no_preprocess`: the /255 lives inside the
# graph, so the calibration data and the runtime input are both BGR 0-255 and
# the compiler must not normalise either.
model_parameters:
  onnx_model: "neuflow_512x384_slim.onnx"
  march: "nash-m"
  working_dir: "./out"
  output_model_file_prefix: "neuflow_v2_int16_nashm_512x384"
input_parameters:
  input_name: "img0;img1"
  input_type_rt: "featuremap;featuremap"
  input_type_train: "featuremap;featuremap"
  input_layout_train: "NCHW;NCHW"
  norm_type: "no_preprocess;no_preprocess"
calibration_parameters:
  cal_data_dir: "/ws/cal/img0;/ws/cal/img1"
  cal_data_type: "float32;float32"
  calibration_type: "default"
  optimization: "set_all_nodes_int16"
compiler_parameters:
  optimize_level: "O2"
  compile_mode: "latency"
