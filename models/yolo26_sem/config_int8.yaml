# YOLO26n-sem, all-int8 build -- KEPT FOR THE RECORD, NOT THE SHIPPED BUILD.
#
# Passes every per-node/per-tensor cosine gate (all >0.95, output 0.9898
# calibrated / 0.9867 on a real held-out image) and still only agrees with
# the float model on 61% of pixel-level argmax decisions -- whole classes
# swap. See config.yaml and README.md for the int16 fix and the measured
# before/after agreement.
model_parameters:
  onnx_model: "yolo26n_sem_bpu.onnx"
  march: "nash-m"
  working_dir: "./out"
  output_model_file_prefix: "yolo26n_sem_nashm_640x640_nv12"
input_parameters:
  input_name: "images"
  input_shape: "1x3x640x640"
  input_type_train: "rgb"
  input_type_rt: "nv12"
  input_layout_train: "NCHW"
  norm_type: "data_scale"
  scale_value: "0.003921568627451"
calibration_parameters:
  cal_data_dir: "/ws/cal_norm/images"
  calibration_type: "default"
compiler_parameters:
  optimize_level: "O2"
  compile_mode: "latency"
  jobs: 32
