# LAS2-L, centre-crop calibration. The larger size: aggregation depth x2, more accurate in the near field, ~0.6x the FPS.
#
# The crop/resize choice is not a quality knob: it must match how the runtime
# letterboxes the incoming pair. See README.md and config_l_resize.yaml.
#
# The `2` is the calibration range: calib.py --extend-range makes the pairs
# span 0..192 px, so the output threshold does not clip near-field disparity
# (the first M build, las2_m_crop_nashm, clipped at 131 px). See README trap 4.
#
# Fully int16 (`set_all_nodes_int16`). int8 puts a ~1px systematic offset on the
# disparity, and mixed precision is 6x slower than this — both measured, see
# expected.json "rejected_builds".
model_parameters:
  onnx_model: "las2_l_480x640.onnx"
  march: "nash-m"
  working_dir: "./out_l_crop"
  output_model_file_prefix: "las2_l_crop2_nashm"
input_parameters:
  input_name: "left;right"
  input_type_rt: "featuremap;featuremap"
  input_type_train: "featuremap;featuremap"
  norm_type: "no_preprocess;no_preprocess"
calibration_parameters:
  cal_data_dir: "/ws/cal_l_crop/left;/ws/cal_l_crop/right"
  # Plain max: int16 has the resolution to keep the true maximum, and the
  # disparity tail is exactly what must not be clipped (README trap 4).
  calibration_type: "max"
  max_percentile: 1.0
  optimization: "set_all_nodes_int16"
compiler_parameters:
  optimize_level: "O2"
  compile_mode: "latency"
  jobs: 32
