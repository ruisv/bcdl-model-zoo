# PointPillars VFE, re-expressed as a 1x1 convolution over (1, 10, 11546, 32).
#
# Input is the 10-channel per-point expansion, not points: the expansion runs on
# the host (BCDL's pillarPointFeatures(), 1.1 ms), which is what makes this graph
# 179x faster than the published VFE. Hence `featuremap` + `no_preprocess`;
# calib.py produces the same tensor the runtime will.
#
# No `optimization` directive, i.e. compiler default (predominantly int8). That
# is deliberate and measured: `set_all_nodes_int16` on this graph scores WORSE
# against the float reference (0.9567 vs int8's 0.9988), and the compiler's own
# per-layer report agrees (conv 0.9926 vs 0.9999). It is also 0.26 ms faster,
# which is not a reason to take it. Do not "upgrade" this to int16 without
# re-measuring.
model_parameters:
  onnx_model: "vfe_conv.onnx"
  march: "nash-m"
  working_dir: "./out_vfe"
  output_model_file_prefix: "pointpillars_vfe_conv_int8_nashm"
input_parameters:
  input_name: "pillar_features_10ch"
  input_type_rt: "featuremap"
  input_type_train: "featuremap"
  input_layout_train: "NCHW"
  norm_type: "no_preprocess"
calibration_parameters:
  cal_data_dir: "/ws/cal_vfe"
  cal_data_type: "float32"
  calibration_type: "default"
compiler_parameters:
  optimize_level: "O2"
  compile_mode: "latency"
